<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Learning Flexbox</title>

    <link rel="stylesheet" href="flex.css">
</head>

<body>

    <h1>Learning Flexbox</h1>

    <h2>What is Flexbox?</h2>

    <p>
        Flexbox is a CSS layout module that makes it easier to design
        flexible and responsive layout structures without using float
        or positioning.
    </p>

    <div class="flex-container">

        <div class="flex-box">Box 1</div>
        <div class="flex-box">Box 2</div>
        <div class="flex-box">Box 3</div>

    </div>

</body>
</html>
