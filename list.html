<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List in html</title>
</head>
<body>
    <h1>List in HTML</h1>
    <h2>Unordered List</h2>
    <UL type="disc">
        <li>html</li>
        <li>CSS</li>
        <li>JS</li>
        <li>DS</li>

    </ul>
    <h2>Ordered List</h2>
    <ol type="A">
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
        <li>BS</li>
    </ol>
    <hr>
    <h2>Descriptive List</h2>
    <dl>
        <dt>HTML</dt>
        <dd>Hyper text markup language</dd>
        <br>
        <dt>CSS</dt>
        <dd>Cascading stylesheet</dd>
    </dl>
    <hr>
    <h2>Nested List</h2>
    <ul>
        <li>HTML</li>
        <ol>
        <li>HTML 4.01</li>
        <li>HTNL 5.0</li>
        <li>HTML 5.1</li>
        <br>
        </ol>
        <li>CSS</li>
        <ol>
            
            <li>CSS</li>
            <li>CSS3</li>
        </ol>
    </ul>
</body>
</html>
