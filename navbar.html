<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>
        *,html{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: rgb(72, 72, 196);
            /* font-family: 'Times New Roman', Times, serif; */
            /* font-size: 12px; */

        } 
        ul{
            list-style: none;
            display: flex;
            justify-content: center;
            margin-top: 10px;
            background-color: rgb(53, 58, 58);
            padding: 10px 0;
        }
        ul li{
            margin:0px 10px;
        }
        ul li a{
            text-decoration: none;
            color: white;
            padding: 5px 6px;
            font-family: Arial, Helvetica, sans-serif;
            font-size:12px;
            
        }
        ul li a:hover{
            color:aqua;
            font-size:13px;
            text-decoration: underline;
            text-shadow: 0px 1px 2px #710522;
        }
        #apply-now{
            background-color: rgb(241, 91, 32);
            border-radius: 5px;
            padding: 5px 8px;
        }
        #apply-now a{
            color: white;
            font-size: 12px;
        }
        #apply-now a:hover{
            font-size: 13px;
            text-decoration: none;
            text-shadow: 0px 1px 2px #710522;
        }
        .active{
            color: aqua;
            font-size: 13px;
            text-decoration: underline;
            text-shadow: 0px 1px 2px #710522;
        }
    </style>
</head>
<body>
